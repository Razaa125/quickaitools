<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | QuickAITools</title>
<meta name="description" content="Get in touch with the QuickAITools team. Send us your feedback, suggestions or report a bug.">
<link rel="canonical" href="https://quickaitools.vercel.app/contact.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<script src="/assets/js/layout.js"></script>
<div class="page-wrapper">
  <h1>Contact Us</h1>
  <p class="lead">Have a question, suggestion or found a bug? We would love to hear from you.</p>

  <div class="contact-form">
    <div class="form-group">
      <label>Your Name</label>
      <input type="text" class="field" id="cName" placeholder="Enter your full name">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" class="field" id="cEmail" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label>Subject</label>
      <select class="field" id="cSubject">
        <option>General Inquiry</option>
        <option>Bug Report</option>
        <option>Feature Request</option>
        <option>Business Inquiry</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea class="field" id="cMessage" rows="5" placeholder="Write your message here…"></textarea>
    </div>
    <button class="btn btn-primary" onclick="sendContact()">Send Message</button>
    <div id="contactMsg" style="margin-top:1rem;display:none"></div>
  </div>

  <div style="margin-top:2.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem">
      <div style="font-size:1.3rem;margin-bottom:0.4rem">📧</div>
      <p style="font-size:0.8rem;font-weight:700;margin-bottom:2px">Email</p>
      <p style="font-size:0.78rem;color:var(--muted)">support@quickaitools.com</p>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem">
      <div style="font-size:1.3rem;margin-bottom:0.4rem">⏱</div>
      <p style="font-size:0.8rem;font-weight:700;margin-bottom:2px">Response Time</p>
      <p style="font-size:0.78rem;color:var(--muted)">Within 24-48 hours</p>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem">
      <div style="font-size:1.3rem;margin-bottom:0.4rem">🌐</div>
      <p style="font-size:0.8rem;font-weight:700;margin-bottom:2px">Based in</p>
      <p style="font-size:0.78rem;color:var(--muted)">Pakistan 🇵🇰</p>
    </div>
  </div>
</div>
<script src="/assets/js/main.js"></script>
<script>
function sendContact() {
  const name = document.getElementById('cName').value.trim();
  const email = document.getElementById('cEmail').value.trim();
  const msg = document.getElementById('cMessage').value.trim();
  const div = document.getElementById('contactMsg');
  if (!name || !email || !msg) { showToast('Please fill in all fields', '#ef4444'); return; }
  if (!email.includes('@')) { showToast('Please enter a valid email', '#ef4444'); return; }
  div.style.display = 'block';
  div.style.cssText = 'display:block;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:8px;padding:1rem;font-size:0.85rem;color:#10b981;margin-top:1rem';
  div.textContent = 'Thank you ' + name + '! Your message has been received. We will reply to ' + email + ' within 24 hours.';
  document.getElementById('cName').value = '';
  document.getElementById('cEmail').value = '';
  document.getElementById('cMessage').value = '';
}
</script>
</body>
</html>
